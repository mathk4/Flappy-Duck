<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Duck</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="authScreen" class="screen active">

    <div class="card">

        <h1>🦆 Flappy Duck</h1>

        <div class="forms">

            <div>
                <h2>Cadastro</h2>

                <input type="text" id="registerName" placeholder="Nome">
                <input type="email" id="registerEmail" placeholder="E-mail">
                <input type="password" id="registerPassword" placeholder="Senha">

                <button onclick="register()">Cadastrar</button>
            </div>

            <div>
                <h2>Login</h2>

                <input type="email" id="loginEmail" placeholder="E-mail">
                <input type="password" id="loginPassword" placeholder="Senha">

                <button onclick="login()">Entrar</button>
            </div>

        </div>

    </div>

</div>

<!-- MENU -->
<div id="menuScreen" class="screen">

    <div class="card">

        <h1>MENU</h1>

        <button onclick="startGame()">Jogar</button>
        <button onclick="openProfile()">Conta</button>
        <button onclick="openRanking()">Ranking</button>
        <button onclick="logout()">Sair</button>

    </div>

</div>

<!-- PERFIL -->
<div id="profileScreen" class="screen">

    <div class="card">

        <h1>Perfil</h1>

        <p>ID: <span id="profileId"></span></p>
        <p>Nome: <span id="profileName"></span></p>
        <p>Maior Pontuação: <span id="profileScore"></span></p>

        <button onclick="goMenu()">Voltar</button>

    </div>

</div>

<!-- RANKING -->
<div id="rankingScreen" class="screen">

    <div class="card">

        <h1>🏆 Ranking</h1>

        <ol id="rankingList"></ol>

        <button onclick="goMenu()">Voltar</button>

    </div>

</div>

<!-- JOGO -->
<div id="gameScreen" class="screen">

    <div id="score">0</div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

</div>

<!-- GAME OVER -->
<div id="gameOverScreen" class="screen">

    <div class="card">

        <h1>💀 Game Over</h1>

        <p>Pontuação: <span id="finalScore"></span></p>
        <p>Recorde: <span id="bestScore"></span></p>

        <button onclick="restartGame()">Jogar Novamente</button>
        <button onclick="goMenu()">Voltar ao Menu</button>

    </div>

</div>

<script src="./utils/ScreenManajer.js"></script>

<script src="./classes/Conta.js"></script>
<script src="./classes/Jogador.js"></script>
<script src="./classes/Pato.js"></script>
<script src="./classes/Cano.js"></script>
<script src="./classes/Ranking.js"></script>
<script src="./classes/Jogo.js"></script>

<script src="main.js"></script>

</body>
</html>
